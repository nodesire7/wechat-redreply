[package]
name = "wechat-redreply"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Standalone Windows WeChat OneBot11 adapter for an existing RedReply"

[workspace]
members = ["offscreen-guard"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = "0.12"
zstd = "0.13"
memchr = "2"
regex = "1"
quick-xml = { version = "=0.39.4", features = ["serialize"] }
rand = "0.8"
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.28"
tokio-rustls = "0.26"
rustls-pemfile = "2"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Security_Cryptography", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[features]
default = []

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
